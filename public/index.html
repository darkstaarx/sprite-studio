<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralCool</title>
<style>
  :root{--bg:#0e1013;--panel:#16191f;--panel-2:#1c2028;--line:#272c36;--ink:#e7eaf0;--dim:#98a1b0;
        --accent:#ffd166;--accent-ink:#2a2000;--ok:#5dd39e;--bad:#ff8f7a;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 90px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:21px;margin:0;letter-spacing:.2px}h1 span{color:var(--accent)}
  .acct{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .dot.on{background:var(--ok)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left}
  .mode[aria-pressed=true]{border-color:var(--accent);background:var(--panel-2)}
  .mode b{display:block;font-size:15px;margin-bottom:3px}
  .mode span{color:var(--dim);font-size:13px}
  .step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
  .step h2{display:flex;align-items:center;gap:10px;font-size:15.5px;margin:0 0 12px}
  .step h2 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-size:14px;font-style:normal;font-weight:700}
  input,textarea,select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;color:var(--ink);font:inherit;font-size:16px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
  .sty{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;text-align:left}
  .sty[aria-pressed=true]{border-color:var(--accent)}
  .sty b{display:block;font-size:14.5px}
  .sty span{color:var(--dim);font-size:12.5px}
  .times{display:flex;gap:9px;flex-wrap:wrap}
  .time{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;font-size:14.5px;color:var(--dim)}
  .time[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .small{width:auto;min-width:120px}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  .btn{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 16px;color:var(--ink);font:inherit;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:14px 20px;width:100%}
  .btn.sm{padding:7px 12px;font-size:13.5px}
  .btn.ghost{background:none}
  .msg{font-size:14px;margin-top:10px;color:var(--dim)}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--accent)}
  .card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
  .card .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:8px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px}
  .card textarea{min-height:130px;font-size:15px}
  .prod{display:flex;gap:11px;align-items:flex-start}
  .prod img{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line);flex:none}
  .prod b{font-size:14.5px}
  .prod .why{color:var(--dim);font-size:13px}
  .hint{color:var(--dim);font-size:13px}
  footer{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--dim);
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  a{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Viral<span>Cool</span></h1>
  <div class="acct"><span class="dot" id="dot"></span><span id="acctText">menyemak…</span>
    <button class="btn sm" id="connect" hidden>Sambung Threads</button></div>
</header>

<div class="modes">
  <button class="mode" id="modeProduk" aria-pressed="true"><b>Ada produk</b><span>Tampal link, dapat post</span></button>
  <button class="mode" id="modeMasalah" aria-pressed="false"><b>Ada masalah</b><span>Cari produk yang tolong</span></button>
</div>

<!-- ============ MOD A ============ -->
<div id="flowProduk">
  <div class="step">
    <h2><i>1</i> Link produk</h2>
    <input id="url" placeholder="https://s.shopee.com.my/…" inputmode="url">
    <p class="msg" id="urlMsg">Link affiliate kau dikekalkan dan dipakai dalam balasan pertama.</p>
  </div>
</div>

<!-- ============ MOD B ============ -->
<div id="flowMasalah" hidden>
  <div class="step">
    <h2><i>1</i> Apa masalahnya</h2>
    <input id="masalah" placeholder="contoh: anak sekolah, dapur panas, kereta selalu rosak">
    <div class="row" style="margin-top:11px">
      <button class="btn" id="cari">Cari produk yang tolong</button>
      <span class="msg" id="cariMsg"></span>
    </div>
    <div id="matches" style="margin-top:12px"></div>
    <details style="margin-top:12px">
      <summary class="hint">Pustaka produk kau (<span id="libCount">0</span>)</summary>
      <div class="row" style="margin:12px 0">
        <input id="libUrl" placeholder="tampal link produk untuk simpan" style="flex:1;min-width:220px">
        <button class="btn sm" id="libAdd">Tambah</button>
      </div>
      <p class="msg" id="libMsg"></p>
      <div id="lib"></div>
    </details>
  </div>
</div>

<!-- ============ LANGKAH BERSAMA ============ -->
<div class="step">
  <h2><i>2</i> Gaya tulisan</h2>
  <div class="styles" id="styles"></div>
</div>

<div class="step">
  <h2><i>3</i> Bila nak keluar</h2>
  <div class="times" id="times"></div>
  <div class="row" style="margin-top:13px">
    <div><label>Mula</label><input id="startDate" type="date" class="small"></div>
    <div><label>Berapa post</label><select id="count" class="small"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></div>
  </div>
  <p class="hint" style="margin-top:10px">7 pagi, 1 tengah hari, 7 malam — waktu orang Malaysia scroll.</p>
</div>

<div class="step">
  <h2><i>4</i> Tulis &amp; jadualkan</h2>
  <button class="btn primary" id="go">Tulis &amp; jadualkan</button>
  <p class="msg" id="goMsg"></p>
  <div id="out" style="margin-top:14px"></div>
  <div class="row" id="outActions" hidden>
    <button class="btn primary" id="approveAll" style="width:auto">Sahkan semua &amp; jadual</button>
    <span class="msg" id="approveMsg"></span>
  </div>
</div>

<footer>
  <span id="queueLine">—</span>
  <a href="/studio.html">Studio lanjutan →</a>
</footer>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let TOKEN=localStorage.getItem("viralcool.token")||"";
let S={products:[],posts:[],accounts:[],styles:{}}, style="cerita", times=["07:00","13:00","19:00"], picked=[], made=[];

async function api(path,opts={},retry=true){
  const r=await fetch("/api"+path,{...opts,headers:{"content-type":"application/json",...(TOKEN?{"x-viralcool-token":TOKEN}:{}),...(opts.headers||{})}});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&retry){ const t=prompt("Kunci server (VIRALCOOL_TOKEN):",TOKEN||""); if(t!==null){ TOKEN=t.trim(); localStorage.setItem("viralcool.token",TOKEN); return api(path,opts,false);} }
  if(!r.ok) throw new Error(j.error||("ralat "+r.status));
  return j;
}
const fmt=ts=>ts?new Date(ts).toLocaleString("ms-MY",{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"tiada masa";

async function load(){
  S=await api("/state");
  const acc=S.accounts.find(a=>a.platform==="threads");
  $("#dot").classList.toggle("on",!!acc);
  $("#acctText").textContent=acc?`Threads: ${acc.label}`:"Threads belum bersambung";
  $("#connect").hidden=!!acc;
  $("#connect").onclick=()=>location.href=S.oauth?.threads?"/oauth/threads/start":"/studio.html#akaun";
  renderStyles(); renderLib();
  const tunggu=S.posts.filter(p=>p.status==="review").length, jadual=S.posts.filter(p=>p.status==="scheduled").length;
  $("#queueLine").textContent=`${tunggu} tunggu sahkan · ${jadual} berjadual · ${S.posts.filter(p=>p.status==="published").length} dah keluar`;
}
function renderStyles(){
  $("#styles").innerHTML=Object.entries(S.styles||{}).map(([k,v])=>
    `<button class="sty" data-style="${k}" aria-pressed="${k===style}"><b>${esc(v.label)}</b><span>${esc(v.nota)}</span></button>`).join("");
  $$(".sty").forEach(b=>b.onclick=()=>{ style=b.dataset.style; $$(".sty").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
}
function renderTimes(){
  const opts=[["07:00","7 pagi"],["13:00","1 tengah hari"],["19:00","7 malam"],["21:00","9 malam"]];
  $("#times").innerHTML=opts.map(([v,l])=>`<button class="time" data-t="${v}" aria-pressed="${times.includes(v)}">${l}</button>`).join("");
  $$(".time").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t;
    times = times.includes(t) ? times.filter(x=>x!==t) : [...times,t].sort();
    if(!times.length) times=[t];
    renderTimes();
  });
}
function renderLib(){
  $("#libCount").textContent=S.products.length;
  $("#lib").innerHTML=S.products.length?S.products.map(p=>`
    <div class="card"><div class="prod">
      ${p.image?`<img src="${esc(p.image)}" alt="">`:""}
      <div style="flex:1"><b>${esc(p.name)}</b>${p.price?` <span class="tag">${esc(p.price)}</span>`:""}
        <div class="why">${esc(p.marketplace||"")}</div></div>
      <button class="btn sm ghost" data-del="${p.id}">✕</button>
    </div></div>`).join(""):'<p class="hint">Kosong. Tampal beberapa link produk supaya sistem ada benda nak cari.</p>';
  $$("[data-del]").forEach(b=>b.onclick=async()=>{ await api("/products/"+b.dataset.del,{method:"DELETE"}); load(); });
}
function postCard(p,i){
  return `<div class="card" data-id="${p.id}">
    <div class="meta"><span class="tag">${esc(p.script?.angle||"")}</span><span>${fmt(p.scheduledAt)}</span>
      <span>${p.text.length} aksara${p.text.length>500?' <span class="bad">— lebih had</span>':""}</span></div>
    <textarea data-text="${p.id}">${esc(p.text)}</textarea>
    ${p.script?.reply?`<p class="hint">Balasan pertama (link): ${esc(p.script.reply)}</p>`:""}
    ${p.script?.visual?`<p class="hint">Visual: ${esc(p.script.visual)}</p>`:""}
  </div>`;
}
async function go(){
  const mode=$("#flowMasalah").hidden?"produk":"masalah";
  $("#goMsg").textContent="menulis…"; $("#out").innerHTML=""; $("#outActions").hidden=true;
  try{
    const common={style,times,startDate:$("#startDate").value,count:Number($("#count").value)};
    let res=[];
    if(mode==="produk"){
      const url=$("#url").value.trim();
      if(!url){ $("#goMsg").innerHTML='<span class="bad">Tampal link produk dulu.</span>'; return; }
      res=[await api("/compose",{method:"POST",body:JSON.stringify({url,...common})})];
    } else {
      if(!picked.length){ $("#goMsg").innerHTML='<span class="bad">Pilih sekurang-kurangnya satu produk.</span>'; return; }
      const perProduk=Math.max(1,Math.round(common.count/picked.length));
      res=[];
      for(const id of picked) res.push(await api("/compose",{method:"POST",body:JSON.stringify({productId:id,masalah:$("#masalah").value.trim(),...common,count:perProduk})}));
    }
    made=res.flatMap(r=>r.posts);
    $("#goMsg").innerHTML=`<span class="ok">${made.length} post siap. Semak, edit kalau perlu, lepas tu sahkan.</span>`;
    $("#out").innerHTML=made.map(postCard).join("");
    $$("[data-text]").forEach(t=>t.onchange=()=>api(`/posts/${t.dataset.text}`,{method:"PATCH",body:JSON.stringify({text:t.value})}));
    $("#outActions").hidden=false;
    load();
  }catch(e){ $("#goMsg").innerHTML=`<span class="bad">${esc(e.message)}</span>`; }
}
$("#go").onclick=go;
$("#approveAll").onclick=async()=>{
  $("#approveMsg").textContent="menjadualkan…";
  for(const p of made) await api(`/posts/${p.id}`,{method:"PATCH",body:JSON.stringify({status:"scheduled"})});
  const acc=S.accounts.find(a=>a.platform==="threads");
  $("#approveMsg").innerHTML=acc
    ? '<span class="ok">Berjadual. Enjin akan hantar sendiri bila sampai masa.</span>'
    : '<span class="warn">Berjadual — tapi Threads belum bersambung, jadi kau kena post sendiri buat masa ni.</span>';
  load();
};
$("#cari").onclick=async()=>{
  const masalah=$("#masalah").value.trim();
  if(!masalah){ $("#cariMsg").innerHTML='<span class="bad">Tulis masalah dulu.</span>'; return; }
  $("#cariMsg").textContent="mencari…"; $("#matches").innerHTML="";
  try{
    const r=await api("/match",{method:"POST",body:JSON.stringify({masalah,count:5})});
    picked=r.matches.map(m=>m.product.id);
    $("#cariMsg").innerHTML=`<span class="ok">${r.matches.length} produk dicadangkan.</span>`;
    $("#matches").innerHTML=r.matches.map(m=>`
      <div class="card"><div class="prod">
        <input type="checkbox" data-pick="${m.product.id}" checked style="width:auto;margin-top:4px">
        ${m.product.image?`<img src="${esc(m.product.image)}" alt="">`:""}
        <div><b>${esc(m.product.name)}</b>${m.product.price?` <span class="tag">${esc(m.product.price)}</span>`:""}
          <div class="why">${esc(m.kenapa)}</div></div>
      </div></div>`).join("");
    $$("[data-pick]").forEach(c=>c.onchange=()=>{
      picked=$$("[data-pick]").filter(x=>x.checked).map(x=>x.dataset.pick);
    });
  }catch(e){ $("#cariMsg").innerHTML=`<span class="bad">${esc(e.message)}</span>`; }
};
$("#libAdd").onclick=async()=>{
  const url=$("#libUrl").value.trim();
  if(!url) return;
  $("#libMsg").textContent="mengesan…";
  try{
    const r=await api("/products",{method:"POST",body:JSON.stringify({url})});
    $("#libUrl").value=""; $("#libMsg").innerHTML=`<span class="ok">${esc(r.product.name)} disimpan.</span>`; load();
  }catch(e){ $("#libMsg").innerHTML=`<span class="bad">${esc(e.message)}</span>`; }
};
$("#modeProduk").onclick=()=>setMode("produk");
$("#modeMasalah").onclick=()=>setMode("masalah");
function setMode(m){
  $("#modeProduk").setAttribute("aria-pressed",String(m==="produk"));
  $("#modeMasalah").setAttribute("aria-pressed",String(m==="masalah"));
  $("#flowProduk").hidden=m!=="produk";
  $("#flowMasalah").hidden=m==="produk";
}
$("#startDate").value=new Date().toISOString().slice(0,10);
renderTimes();
load().catch(e=>{ $("#acctText").textContent="tak dapat sambung server"; console.error(e); });
</script>
</body>
</html>
